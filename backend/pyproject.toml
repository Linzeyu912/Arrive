[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arrive-backend"
version = "0.1.0"
description = "Backend for the Arrive thought-translation framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2.0",
  "fastapi>=0.136,<1.0",
  "pydantic>=2.12,<3.0",
  "sqlalchemy>=2.0.48,<3.0",
  "uvicorn[standard]>=0.46,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
