[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arrive-backend"
dynamic = ["version"]
description = "Backend for the Arrive thought-translation framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docling-slim[convert-core,format-pdf-pypdfium2,format-pdf-docling,format-docx,format-pptx,format-xlsx,format-html,format-markdown,feat-ocr-rapidocr,models-local]==2.126.0",
  "onnxruntime>=1.24,<2",
  "filelock>=3.20,<4",
  "pyyaml>=6,<7",
  "alembic>=1.18,<2.0",
  "fastapi>=0.136,<1.0",
  "pydantic>=2.12,<3.0",
  "sqlalchemy>=2.0.48,<3.0",
  "uvicorn[standard]>=0.46,<1.0",
]

[project.optional-dependencies]
documents = [] # Compatibility alias; conversion is now a built-in dependency.
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
]

[project.scripts]
arrive-archive = "arrive.document_archive:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "arrive.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
