services:
  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${ARRIVE_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  api:
    build:
      context: ./backend
    environment:
      ARRIVE_DATA_DIR: /data
      ARRIVE_DEFAULT_TIMEZONE: Asia/Shanghai
    volumes:
      - type: bind
        source: ${ARRIVE_DOCKER_DATA_DIR:-./arrive-data}
        target: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
